[general]
framerate = 20
bars = 7
lower_cutoff_freq = 60
higher_cutoff_freq = 12000
sleep_timer = 5

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 32
frame_delimiter = 10
